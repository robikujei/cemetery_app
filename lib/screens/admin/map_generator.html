<!DOCTYPE html>
<html>
<head>
    <title>Cemetery Map Generator</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        canvas { border: 1px solid #ccc; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; background: #4B6E4F; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Cemetery Map Generator</h2>
    <p>Generate a sample cemetery map for testing</p>
    <button onclick="generateMap()">Generate Map</button>
    <br>
    <canvas id="mapCanvas" width="800" height="600"></canvas>
    
    <script>
        function generateMap() {
            const canvas = document.getElementById('mapCanvas');
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, 800, 600);
            
            // Grass/ground
            ctx.fillStyle = '#7cb342';
            ctx.fillRect(0, 0, 800, 600);
            
            // Paths
            ctx.fillStyle = '#d7ccc8';
            ctx.fillRect(0, 200, 800, 30);
            ctx.fillRect(0, 400, 800, 30);
            ctx.fillRect(380, 0, 30, 600);
            
            // Section labels
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px Arial';
            ctx.fillText('GARDEN OF PEACE', 50, 50);
            ctx.fillText('GARDEN OF HOPE', 450, 50);
            ctx.fillText('GARDEN OF FAITH', 50, 450);
            ctx.fillText('GARDEN OF LOVE', 450, 450);
            
            // Draw lots
            const statuses = ['Available', 'Occupied', 'Reserved'];
            const colors = ['#4caf50', '#f44336', '#ff9800'];
            
            // Section A (top left)
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const x = 30 + col * 110;
                    const y = 80 + row * 90;
                    const statusIndex = (row + col) % 3;
                    ctx.fillStyle = colors[statusIndex];
                    ctx.fillRect(x, y, 90, 70);
                    ctx.strokeStyle = '#ffffff';
                    ctx.strokeRect(x, y, 90, 70);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText(`A-${row * 3 + col + 1}`, x + 25, y + 30);
                    ctx.font = '10px Arial';
                    ctx.fillText(statuses[statusIndex], x + 20, y + 50);
                }
            }
            
            // Section B (top right)
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const x = 430 + col * 110;
                    const y = 80 + row * 90;
                    const statusIndex = (row + col + 1) % 3;
                    ctx.fillStyle = colors[statusIndex];
                    ctx.fillRect(x, y, 90, 70);
                    ctx.strokeStyle = '#ffffff';
                    ctx.strokeRect(x, y, 90, 70);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText(`B-${row * 3 + col + 1}`, x + 25, y + 30);
                    ctx.font = '10px Arial';
                    ctx.fillText(statuses[statusIndex], x + 20, y + 50);
                }
            }
            
            // Section C (bottom left)
            for (let row = 0; row < 2; row++) {
                for (let col = 0; col < 3; col++) {
                    const x = 30 + col * 110;
                    const y = 460 + row * 90;
                    const statusIndex = (row + col + 2) % 3;
                    ctx.fillStyle = colors[statusIndex];
                    ctx.fillRect(x, y, 90, 70);
                    ctx.strokeStyle = '#ffffff';
                    ctx.strokeRect(x, y, 90, 70);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText(`C-${row * 3 + col + 1}`, x + 25, y + 30);
                    ctx.font = '10px Arial';
                    ctx.fillText(statuses[statusIndex], x + 20, y + 50);
                }
            }
            
            // Section D (bottom right)
            for (let row = 0; row < 2; row++) {
                for (let col = 0; col < 3; col++) {
                    const x = 430 + col * 110;
                    const y = 460 + row * 90;
                    const statusIndex = (row + col) % 3;
                    ctx.fillStyle = colors[statusIndex];
                    ctx.fillRect(x, y, 90, 70);
                    ctx.strokeStyle = '#ffffff';
                    ctx.strokeRect(x, y, 90, 70);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText(`D-${row * 3 + col + 1}`, x + 25, y + 30);
                    ctx.font = '10px Arial';
                    ctx.fillText(statuses[statusIndex], x + 20, y + 50);
                }
            }
            
            // Title
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px Arial';
            ctx.fillText('PANABO CITY MEMORIAL PARK', 250, 30);
        }
        
        // Generate on load
        generateMap();
    </script>
</body>
</html>
